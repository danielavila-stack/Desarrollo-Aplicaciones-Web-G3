<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Hospital San Marcos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/hospital.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand navbar-dark hospital-navbar sticky-top py-2">
    <div class="container-fluid px-4 flex-wrap gap-2">
        <a class="navbar-brand hospital-brand d-flex align-items-center gap-2" href="/index.html">
            <i class="bi bi-hospital fs-3 text-info"></i><span>HOSPITAL SAN MARCOS</span>
        </a>
        <div id="navbarSesion" class="d-flex flex-grow-1 flex-wrap align-items-center justify-content-between gap-2"></div>
    </div>
</nav>

<div class="container-fluid px-4 py-4">
    <div class="d-flex align-items-center gap-2 mb-4">
        <i class="bi bi-people-fill fs-3 text-primary"></i>
        <div>
            <h4 class="fw-bold mb-0">Gestión de Usuarios</h4>
            <small class="text-muted">Registrar, editar, asignar rol y activar/desactivar usuarios del sistema</small>
        </div>
    </div>

    <div id="resUsuario"></div>

    <div class="row g-4">
        <!-- FORMULARIO DE REGISTRO / EDICIÓN -->
        <div class="col-lg-4">
            <div class="card main-card">
                <div class="card-header-custom d-flex align-items-center gap-2">
                    <i class="bi bi-person-plus fs-4 text-primary" id="iconoForm"></i>
                    <h5 class="mb-0 fw-bold" id="tituloForm">Registrar Usuario</h5>
                </div>
                <div class="card-body p-4">
                    <form id="formUsuario" onsubmit="guardarUsuario(event)">
                        <input type="hidden" id="usrId">
                        <div class="mb-3">
                            <label class="form-label">Usuario (login)</label>
                            <input type="text" id="usrUsername" class="form-control" placeholder="Ej: jperez" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" id="usrNombre" class="form-control" placeholder="Ej: Juan Pérez Ramos" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" id="usrEmail" class="form-control" placeholder="jperez@hospital.pe">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rol Asignado</label>
                            <select id="usrRol" class="form-select" required></select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Contraseña</label>
                            <input type="password" id="usrPassword" class="form-control" placeholder="Mínimo 6 caracteres" minlength="6">
                            <small class="text-muted d-none" id="ayudaPassword">Déjela vacía para mantener la contraseña actual.</small>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4 fw-semibold" id="btnGuardar">
                                <i class="bi bi-save me-1"></i> Guardar
                            </button>
                            <button type="button" class="btn btn-outline-secondary d-none" id="btnCancelar" onclick="limpiarFormulario()">
                                Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- LISTADO DE USUARIOS -->
        <div class="col-lg-8">
            <div class="card main-card">
                <div class="card-header-custom d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-list-ul fs-4 text-primary"></i>
                        <h5 class="mb-0 fw-bold">Usuarios Registrados</h5>
                    </div>
                    <button class="btn btn-sm btn-outline-primary" onclick="cargarUsuarios()">
                        <i class="bi bi-arrow-clockwise"></i> Refrescar
                    </button>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 table-custom">
                            <thead class="bg-light">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>USUARIO</th>
                                <th>NOMBRE / CORREO</th>
                                <th>ROL</th>
                                <th>ESTADO</th>
                                <th class="pe-4 text-center">ACCIONES</th>
                            </tr>
                            </thead>
                            <tbody id="tablaUsuarios">
                            <tr><td colspan="6" class="text-center py-4 text-muted">Cargando usuarios...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/sesion.js"></script>
<script>
    let usuarios = [];

    document.addEventListener('DOMContentLoaded', async () => {
        await iniciarSesion();
        await cargarRoles();
        await cargarUsuarios();
        limpiarFormulario();
    });

    // Llena el selector de roles (los inactivos aparecen deshabilitados)
    async function cargarRoles() {
        const roles = await api('/roles');
        document.getElementById('usrRol').innerHTML =
            '<option value="">-- Seleccione un rol --</option>' +
            roles.map(r => `<option value="${r.id}" ${r.activo ? '' : 'disabled'}>${escaparHtml(r.nombre)}${r.activo ? '' : ' (inactivo)'}</option>`).join('');
    }

    async function cargarUsuarios() {
        const tbody = document.getElementById('tablaUsuarios');
        try {
            usuarios = await api('/usuarios');
            if (usuarios.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No hay usuarios registrados.</td></tr>';
                return;
            }
            tbody.innerHTML = usuarios.map(u => `
                <tr class="${u.activo ? '' : 'fila-inactiva'}">
                    <td class="ps-4 fw-semibold">${u.id}</td>
                    <td><code class="fw-bold text-primary">${escaparHtml(u.username)}</code></td>
                    <td>${escaparHtml(u.nombreCompleto)}<br><small class="text-muted">${escaparHtml(u.email || '-')}</small></td>
                    <td><span class="badge-rol rol-${u.rolNombre}">${escaparHtml(u.rolNombre)}</span></td>
                    <td><span class="badge ${u.activo ? 'estado-activo' : 'estado-inactivo'} px-3 py-2">${u.activo ? 'ACTIVO' : 'INACTIVO'}</span></td>
                    <td class="pe-4 text-center text-nowrap">
                        <button class="btn btn-sm btn-outline-primary" onclick="editarUsuario(${u.id})" title="Editar">
                            <i class="bi bi-pencil-square"></i> Editar
                        </button>
                        <button class="btn btn-sm ${u.activo ? 'btn-outline-danger' : 'btn-outline-success'}" onclick="cambiarEstado(${u.id}, ${!u.activo})">
                            <i class="bi ${u.activo ? 'bi-toggle-off' : 'bi-toggle-on'}"></i> ${u.activo ? 'Desactivar' : 'Activar'}
                        </button>
                    </td>
                </tr>`).join('');
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">${escaparHtml(err.message)}</td></tr>`;
        }
    }

    // Registro (POST) o edición (PUT) según si hay un ID cargado
    async function guardarUsuario(e) {
        e.preventDefault();
        const id = document.getElementById('usrId').value;
        const payload = {
            username: document.getElementById('usrUsername').value,
            nombreCompleto: document.getElementById('usrNombre').value,
            email: document.getElementById('usrEmail').value,
            rolId: Number(document.getElementById('usrRol').value),
            password: document.getElementById('usrPassword').value
        };
        try {
            if (id) {
                await api(`/usuarios/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
                mostrarAlerta('resUsuario', 'success', `Usuario <strong>${escaparHtml(payload.username)}</strong> actualizado correctamente.`);
            } else {
                const nuevo = await api('/usuarios', { method: 'POST', body: JSON.stringify(payload) });
                mostrarAlerta('resUsuario', 'success', `Usuario <strong>${escaparHtml(nuevo.username)}</strong> registrado con ID ${nuevo.id}.`);
            }
            limpiarFormulario();
            cargarUsuarios();
        } catch (err) {
            mostrarAlerta('resUsuario', 'danger', escaparHtml(err.message));
        }
    }

    function editarUsuario(id) {
        const u = usuarios.find(x => x.id === id);
        document.getElementById('usrId').value = u.id;
        document.getElementById('usrUsername').value = u.username;
        document.getElementById('usrUsername').readOnly = true;
        document.getElementById('usrNombre').value = u.nombreCompleto;
        document.getElementById('usrEmail').value = u.email || '';
        document.getElementById('usrRol').value = u.rolId;
        document.getElementById('usrPassword').value = '';
        document.getElementById('usrPassword').required = false;
        document.getElementById('ayudaPassword').classList.remove('d-none');
        document.getElementById('tituloForm').innerText = `Editar Usuario #${u.id}`;
        document.getElementById('iconoForm').className = 'bi bi-pencil-square fs-4 text-warning';
        document.getElementById('btnCancelar').classList.remove('d-none');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function cambiarEstado(id, activo) {
        try {
            const u = await api(`/usuarios/${id}/estado?activo=${activo}`, { method: 'PATCH' });
            mostrarAlerta('resUsuario', 'success', `Usuario <strong>${escaparHtml(u.username)}</strong> ${activo ? 'activado' : 'desactivado'}.`);
            cargarUsuarios();
        } catch (err) {
            mostrarAlerta('resUsuario', 'danger', escaparHtml(err.message));
        }
    }

    function limpiarFormulario() {
        document.getElementById('formUsuario').reset();
        document.getElementById('usrId').value = '';
        document.getElementById('usrUsername').readOnly = false;
        document.getElementById('usrPassword').required = true;
        document.getElementById('ayudaPassword').classList.add('d-none');
        document.getElementById('tituloForm').innerText = 'Registrar Usuario';
        document.getElementById('iconoForm').className = 'bi bi-person-plus fs-4 text-primary';
        document.getElementById('btnCancelar').classList.add('d-none');
    }
</script>
</body>
</html>
