<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Hospital San Marcos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/hospital.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f4c81 0%, #1b4965 60%, #00a896 140%);
        }
        .login-card {
            max-width: 420px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

<div class="card login-card w-100">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <i class="bi bi-hospital text-primary" style="font-size: 3rem;"></i>
            <h4 class="fw-bold mt-2 mb-0">HOSPITAL SAN MARCOS</h4>
            <p class="text-muted small mb-0">Sistema de Admisión y Atención</p>
        </div>

        <div id="mensajeLogin"></div>

        <!-- Spring Security procesa este formulario en POST /login -->
        <form action="/login" method="post">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Ingrese su usuario" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Ingrese su contraseña" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
            </button>
        </form>
    </div>
</div>

<script>
    // Mensajes según el parámetro que envía Spring Security al redirigir
    const params = new URLSearchParams(window.location.search);
    const contenedor = document.getElementById('mensajeLogin');
    if (params.has('error')) {
        contenedor.innerHTML = '<div class="alert alert-danger py-2 small"><i class="bi bi-x-circle me-1"></i>Usuario o contraseña incorrectos.</div>';
    } else if (params.has('inactivo')) {
        contenedor.innerHTML = '<div class="alert alert-warning py-2 small"><i class="bi bi-slash-circle me-1"></i>Su usuario o su rol se encuentra desactivado. Contacte al administrador.</div>';
    } else if (params.has('logout')) {
        contenedor.innerHTML = '<div class="alert alert-success py-2 small"><i class="bi bi-check-circle me-1"></i>Sesión cerrada correctamente.</div>';
    }
</script>
</body>
</html>
