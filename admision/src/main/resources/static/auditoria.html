<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría - Hospital San Marcos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/hospital.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand navbar-dark hospital-navbar sticky-top py-2">
    <div class="container-fluid px-4 flex-wrap gap-2">
        <a class="navbar-brand hospital-brand d-flex align-items-center gap-2" href="/index.html">
            <i class="bi bi-hospital fs-3 text-info"></i><span>HOSPITAL SAN MARCOS</span>
        </a>
        <div id="navbarSesion" class="d-flex flex-grow-1 flex-wrap align-items-center justify-content-between gap-2"></div>
    </div>
</nav>

<div class="container-fluid px-4 py-4">
    <div class="d-flex align-items-center gap-2 mb-4">
        <i class="bi bi-journal-text fs-3 text-primary"></i>
        <div>
            <h4 class="fw-bold mb-0">Bitácora de Auditoría</h4>
            <small class="text-muted">Operaciones registradas automáticamente mediante AOP</small>
        </div>
    </div>

    <div class="card main-card">
        <div class="card-header-custom d-flex flex-wrap gap-2 justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <label class="form-label mb-0">Entidad:</label>
                <select id="filtroEntidad" class="form-select form-select-sm" style="width: auto;" onchange="cargarAuditoria()">
                    <option value="">Todas</option>
                    <option>Paciente</option>
                    <option>Admision</option>
                    <option>Triaje</option>
                    <option>Usuario</option>
                    <option>Rol</option>
                </select>
            </div>
            <button class="btn btn-sm btn-outline-primary" onclick="cargarAuditoria()">
                <i class="bi bi-arrow-clockwise"></i> Refrescar
            </button>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 table-custom">
                    <thead class="bg-light">
                    <tr>
                        <th class="ps-4">#</th>
                        <th>FECHA Y HORA</th>
                        <th>USUARIO</th>
                        <th>OPERACIÓN</th>
                        <th>ENTIDAD</th>
                        <th>ID REGISTRO</th>
                        <th class="pe-4">DETALLE</th>
                    </tr>
                    </thead>
                    <tbody id="tablaAuditoria">
                    <tr><td colspan="7" class="text-center py-4 text-muted">Cargando bitácora...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/sesion.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        await iniciarSesion();
        cargarAuditoria();
    });

    async function cargarAuditoria() {
        const tbody = document.getElementById('tablaAuditoria');
        const entidad = document.getElementById('filtroEntidad').value;
        try {
            const registros = await api('/auditoria' + (entidad ? `?entidad=${encodeURIComponent(entidad)}` : ''));
            if (registros.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">Aún no hay operaciones registradas.</td></tr>';
                return;
            }
            tbody.innerHTML = registros.map(a => `
                <tr>
                    <td class="ps-4 fw-semibold">${a.id}</td>
                    <td><small><i class="bi bi-clock me-1 text-muted"></i>${a.fechaHora.replace('T', ' ')}</small></td>
                    <td><i class="bi bi-person-circle me-1 text-secondary"></i>${escaparHtml(a.usuario)}</td>
                    <td><span class="badge op-${a.operacion} px-3 py-2">${a.operacion}</span></td>
                    <td class="fw-semibold">${escaparHtml(a.entidad)}</td>
                    <td><code>${a.registroId ?? '-'}</code></td>
                    <td class="pe-4"><small class="text-muted">${escaparHtml(a.detalle || '')}</small></td>
                </tr>`).join('');
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-danger">${escaparHtml(err.message)}</td></tr>`;
        }
    }
</script>
</body>
</html>
